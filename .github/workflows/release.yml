name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test RecallSearch.sln -c Release
      - name: Build the archive
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version ("${{ github.ref_name }}" -replace '^v', '')
      - name: Create a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --draft --generate-notes --title "${{ github.ref_name }}" (Get-ChildItem dist -Filter 'RecallSearch-*.zip*').FullName
