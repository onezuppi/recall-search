name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Recall Search version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows and PowerToys version
      placeholder: "Windows 11 24H2, PowerToys 0.9x"
  - type: dropdown
    id: device
    attributes:
      label: Semantic search
      options: ["Off", "cpu", "npu"]
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The last lines of %LOCALAPPDATA%\RecallSearch\recall.log. Remove personal paths first.
      render: text
